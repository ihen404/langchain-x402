[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-tools-langchain"
version = "0.1.4"
description = "LangChain tool integration for x402 web scraper with HTTP 402 micro-transactions on Base."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langchain-core>=0.1.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "eth-account>=0.8.0",
    "web3>=6.0.0"
]

[project.optional-dependencies]
dev = [
    "build",
    "twine"
]
