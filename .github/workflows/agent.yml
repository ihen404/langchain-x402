name: Scheduled On-Chain Agent Execution

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  execute-agent-payment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: cd x402-scraper-client && npm install
      - name: Run On-Chain Agent Settlement
        env:
          BASE_AGENT_PRIVATE_KEY: ${{ secrets.BASE_AGENT_PRIVATE_KEY }}
        run: cd x402-scraper-client && node agent-runner.js
